  <style>
:root {
  color-scheme: light;
  --paper: #f3efe5;
  --paper-2: #ebe5d8;
  --ink: #18201d;
  --muted: #6e746f;
  --line: rgba(24, 32, 29, 0.14);
  --line-strong: rgba(24, 32, 29, 0.25);
  --card: rgba(255, 253, 247, 0.84);
  --card-solid: #fbf8f0;
  --lime: #d8f45c;
  --coral: #ff7f66;
  --sky: #9ad7e7;
  --violet: #a991ff;

  --radius-xl: 34px;
  --radius-lg: 25px;

  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans Thai", "Thonburi", "Microsoft YaHei", sans-serif;
  --serif: "Iowan Old Style", "Baskerville", "Songti SC", "STSong", serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(circle at 17% 11%, rgba(216, 244, 92, .28), transparent 28rem),
    radial-gradient(circle at 86% 28%, rgba(154, 215, 231, .23), transparent 31rem),
    var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body.dark {
  color-scheme: dark;
  --paper: #121714;
  --paper-2: #1a211d;
  --ink: #f1f2ea;
  --muted: #a5aaa4;
  --line: rgba(241, 242, 234, 0.13);
  --line-strong: rgba(241, 242, 234, 0.24);
  --card: rgba(26, 33, 29, 0.83);
  --card-solid: #1a211d;
  --shadow: 0 34px 90px rgba(0, 0, 0, .25);
  background:
    radial-gradient(circle at 17% 11%, rgba(216, 244, 92, .10), transparent 28rem),
    radial-gradient(circle at 86% 28%, rgba(154, 215, 231, .10), transparent 31rem),
    var(--paper);
}

button, input, select { font: inherit; }
button, summary, select { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--violet) 70%, transparent);
  outline-offset: 3px;
}

.shell { width: min(1360px, calc(100% - 48px)); margin-inline: auto; }

.ambient {
  position: fixed;
  width: 520px;
  height: 520px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: .15;
  pointer-events: none;
  z-index: -1;
}
.ambient-a { background: var(--coral); left: -360px; top: 45vh; }
.ambient-b { background: var(--violet); right: -400px; top: 95vh; }

.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 82px;
  padding: 0 max(24px, calc((100vw - 1360px) / 2));
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--paper) 78%, transparent);
  backdrop-filter: blur(22px) saturate(1.15);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: inherit;
  text-decoration: none;
}
.brand-mark {
  display: grid;
  place-items: center;
  width: 43px;
  height: 43px;
  border: 1px solid var(--line-strong);
  border-radius: 50%;
  font-family: var(--serif);
  font-size: 25px;
  background: var(--lime);
  color: #18201d;
  transform: rotate(-6deg);
}
.brand strong, .brand small { display: block; }
.brand strong { font-family: var(--serif); font-size: 19px; letter-spacing: .05em; }
.brand small { margin-top: 2px; color: var(--muted); font-size: 9px; letter-spacing: .18em; }
.header-actions { display: flex; align-items: center; gap: 8px; }
.icon-button {
  min-height: 42px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: color-mix(in srgb, var(--card-solid) 68%, transparent);
  cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, background .2s ease;

}
.icon-button::-webkit-details-marker { display: none; }
.icon-button:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.icon-button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.voice-menu { position: relative; }
.voice-popover {
  position: absolute;
  right: 0;
  top: calc(100% + 12px);
  width: min(350px, calc(100vw - 32px));
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: color-mix(in srgb, var(--card-solid) 95%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px);
}
.popover-heading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.popover-heading strong, .popover-heading span { display: block; }
.popover-heading strong { font-family: var(--serif); font-size: 19px; }
.popover-heading span { color: var(--muted); font-size: 12px; margin-top: 3px; }
.voice-popover label { display: grid; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 12px; }
.voice-popover label > span { display: flex; justify-content: space-between; }
.voice-popover select, .voice-popover input[type="range"] { width: 100%; }
.voice-popover select {
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 10px;
  color: var(--ink);
  background: var(--paper);
}
.voice-note { margin: 15px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
.voice-note code { color: var(--ink); }
.mini-play { border: 0; border-radius: 999px; background: var(--lime); color: #18201d; padding: 7px 12px; cursor: pointer; align-self: flex-start; }

.hero {
  min-height: 610px;
  display: grid;
  grid-template-columns: 1.12fr .88fr;
  gap: 70px;
  align-items: center;
  padding-block: 74px 64px;
}
.eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; color: var(--muted); font-size: 12px; letter-spacing: .16em; }
.eyebrow span { width: 38px; height: 1px; background: currentColor; }
.hero h1 {
  margin: 0;
  max-width: 780px;
  font-family: var(--serif);
  font-size: clamp(58px, 7vw, 108px);
  line-height: .94;
  letter-spacing: -.055em;
  font-weight: 500;
}
.hero h1 em { font-style: italic; font-weight: 400; }
.hero-description { max-width: 640px; margin: 30px 0 0; color: var(--muted); font-size: clamp(16px, 1.5vw, 20px); line-height: 1.75; }
.hero-metrics { display: flex; gap: 34px; margin-top: 38px; }
.hero-metrics div { padding-right: 34px; border-right: 1px solid var(--line); }
.hero-metrics div:last-child { border-right: 0; }
.hero-metrics strong, .hero-metrics span { display: block; }
.hero-metrics strong { font-family: var(--serif); font-size: 28px; }
.hero-metrics span { color: var(--muted); margin-top: 2px; font-size: 11px; letter-spacing: .12em; }

.hero-art {
  position: relative;
  width: min(100%, 490px);
  aspect-ratio: 1;
  justify-self: center;
  display: grid;
  overflow: clip;
  place-items: center;
}
.hero-art::before {
  content: "";
  position: absolute;
  inset: 9%;
  border-radius: 48% 52% 56% 44% / 46% 38% 62% 54%;
  background: linear-gradient(145deg, var(--lime), #efffa8 42%, var(--sky));
  box-shadow: inset 0 0 0 1px rgba(24,32,29,.12), 0 40px 90px rgba(123, 149, 72, .18);
  animation: morph 12s ease-in-out infinite alternate;
}
body.dark .hero-art::before { opacity: .9; }
.hero-art svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: color-mix(in srgb, var(--ink) 42%, transparent); stroke-width: .8; animation: rotateSlow 28s linear infinite; }
.hero-art svg path:last-child { stroke-dasharray: 3 7; animation: rotateReverse 22s linear infinite; transform-origin: center; }
.core-word { position: relative; z-index: 3; font-family: var(--serif); font-size: clamp(64px, 8vw, 114px); color: #18201d; letter-spacing: -.08em; transform: rotate(-4deg); }
.orbit {
  position: absolute;
  z-index: 4;
  display: grid;
  place-items: center;
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 1px solid rgba(24,32,29,.18);
  color: #18201d;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(9px);
  font-family: var(--serif);
  font-size: 18px;
  box-shadow: 0 14px 30px rgba(24,32,29,.10);
}
.orbit-one { left: 2%; top: 18%; animation: float 5s ease-in-out infinite; }
.orbit-two { right: 0; bottom: 19%; animation: float 6.5s ease-in-out -1s infinite; background: var(--coral); }

.workspace { padding-bottom: 90px; }
.control-panel {
  position: sticky;
  top: 98px;
  z-index: 30;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: color-mix(in srgb, var(--card) 93%, transparent);
  box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.15);
}
.level-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.level-button {
  position: relative;
  min-height: 76px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: transparent;
  cursor: pointer;
  overflow: hidden;
  transition: transform .25s ease, background .25s ease, color .25s ease, border-color .25s ease;
}
.level-button::after { content: ""; position: absolute; width: 90px; height: 90px; right: -28px; bottom: -56px; border-radius: 50%; background: var(--lime); opacity: 0; transition: opacity .25s ease, transform .25s ease; }
.level-button:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.level-button.active { color: var(--paper); background: var(--ink); border-color: var(--ink); }
.level-button.active::after { opacity: .34; transform: translateY(-12px); }
.level-button span { position: relative; z-index: 1; font-family: var(--serif); font-size: 27px; }
.level-button small { position: relative; z-index: 1; font-size: 11px; letter-spacing: .08em; opacity: .72; }
.search-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-top: 15px; }
.search-box { height: 54px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 1px solid var(--line); border-radius: 16px; background: color-mix(in srgb, var(--paper) 58%, transparent); }
.search-box span { font-size: 24px; transform: rotate(-12deg); }
.search-box input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 15px; }
.search-box input::placeholder { color: var(--muted); }
kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; color: var(--muted); background: color-mix(in srgb, var(--paper-2) 70%, transparent); font: 10px var(--sans); }
.soft-button { padding: 0 19px; border: 1px solid var(--line); border-radius: 16px; background: var(--lime); color: #18201d; cursor: pointer; font-size: 13px; transition: transform .2s ease; }
.soft-button:hover { transform: rotate(-1deg) translateY(-2px); }
.filter-row { display: flex; align-items: end; gap: 12px; margin-top: 15px; }
.select-field { display: grid; gap: 5px; min-width: 190px; }
.select-field > span { color: var(--muted); font-size: 10px; letter-spacing: .12em; }
.select-field select { height: 40px; padding: 0 34px 0 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: color-mix(in srgb, var(--paper) 72%, transparent); }
.compact-field { min-width: 110px; margin-left: auto; }
.result-summary { min-width: 190px; display: flex; align-items: baseline; gap: 9px; justify-content: flex-end; padding-bottom: 8px; }
.result-summary strong { font-family: var(--serif); font-size: 25px; }
.result-summary span { color: var(--muted); font-size: 11px; }

.progress-panel { display: grid; grid-template-columns: 190px 1fr; gap: 18px; align-items: center; margin: 34px 4px 18px; }
.progress-panel > div:first-child { display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 11px; }
.progress-panel strong { color: var(--ink); font-weight: 600; }
.progress-track { height: 3px; overflow: hidden; border-radius: 999px; background: var(--line); }
.progress-track span { display: block; width: 0; height: 100%; background: linear-gradient(90deg, var(--coral), var(--violet)); transition: width .5s cubic-bezier(.2,.8,.2,1); }

.card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.vocab-card {
  position: relative;
  min-height: 390px;
  padding: 27px;
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--card);
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(37, 43, 35, .045);
  animation: cardIn .48s cubic-bezier(.2,.8,.2,1) both;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease, border-color .3s ease;
}
.vocab-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, var(--lime), var(--sky), var(--coral)); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
.vocab-card:hover { transform: translateY(-5px); border-color: var(--line-strong); box-shadow: 0 22px 55px rgba(37, 43, 35, .10); }
.vocab-card:hover::before { transform: scaleX(1); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
.card-index { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }
.card-index::before { content: ""; width: 22px; height: 1px; background: currentColor; }
.card-actions { display: flex; gap: 7px; }
.round-action { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: transparent; cursor: pointer; transition: background .2s ease, transform .2s ease; }
.round-action:hover { transform: scale(1.07); }
.round-action.active { background: var(--lime); color: #18201d; border-color: transparent; }
.round-action.mastered.active { background: var(--ink); color: var(--paper); }
.word-row { display: flex; align-items: flex-start; gap: 14px; margin-top: 22px; }
.speak-target { border: 0; padding: 0; text-align: left; color: inherit; background: transparent; cursor: pointer; }
.word-button { flex: 1; }
.word-button strong { display: block; font-family: var(--serif); font-size: clamp(38px, 4vw, 56px); font-weight: 500; line-height: 1.05; letter-spacing: -.025em; }
.word-button:hover strong, .sentence-button:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.speaker-button { flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: color-mix(in srgb, var(--paper) 65%, transparent); cursor: pointer; }
.speaker-button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.speaking .speaker-button, .speaker-button.speaking { background: var(--coral); color: #18201d; border-color: transparent; animation: pulse .9s ease-in-out infinite; }
.meaning-line { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 9px; }
.meaning { font-size: 17px; font-weight: 650; }
.meta-chip { display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 10px; }
.english-chip { background: color-mix(in srgb, var(--sky) 28%, transparent); }
.example-block { margin-top: 28px; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.sentence-row { display: flex; align-items: flex-start; gap: 12px; }
.sentence-button { flex: 1; font-family: var(--serif); font-size: clamp(21px, 2vw, 28px); line-height: 1.45; }
.sentence-play { width: 33px; height: 33px; margin-top: 2px; font-size: 13px; }
.translation { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
.breakdown { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 19px; }
.token { padding: 6px 9px; border: 1px solid var(--line); border-radius: 9px; background: color-mix(in srgb, var(--paper-2) 52%, transparent); font-size: 11px; line-height: 1.35; }
.card-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
.card-meta .meta-chip:first-child { background: color-mix(in srgb, var(--violet) 15%, transparent); }

.practice .cn-content { filter: blur(8px); user-select: none; cursor: pointer; transition: filter .2s ease; }
.practice .cn-content:hover, .practice .cn-content.revealed { filter: none; }

.empty-state { grid-column: 1 / -1; padding: 90px 24px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); }
.empty-state strong { display: block; font-family: var(--serif); font-size: 38px; font-weight: 500; }
.empty-state p { color: var(--muted); }
.empty-state button { margin-top: 10px; }

.pagination { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; margin-top: 28px; padding: 18px 4px 0; }
.pagination > button { min-height: 48px; padding: 0 17px; border: 1px solid var(--line); border-radius: 15px; background: var(--card); cursor: pointer; }
.pagination > button:first-child { justify-self: start; }
.pagination > button:last-child { justify-self: end; }
.pagination > button:disabled { opacity: .35; cursor: not-allowed; }
.page-jump { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.page-jump input { width: 66px; height: 42px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: var(--card); text-align: center; }

.site-footer { display: flex; align-items: center; justify-content: space-between; gap: 28px; padding-block: 34px 48px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
.site-footer strong, .site-footer span { display: block; }
.site-footer strong { color: var(--ink); font-family: var(--serif); font-size: 19px; }
.site-footer span { margin-top: 4px; }
.site-footer p { margin: 0; }
.site-footer kbd + kbd { margin-left: 4px; }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 90; transform: translate(-50%, 22px); padding: 11px 16px; border-radius: 999px; color: var(--paper); background: var(--ink); opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; box-shadow: var(--shadow); font-size: 12px; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes morph { 0% { border-radius: 48% 52% 56% 44% / 46% 38% 62% 54%; transform: rotate(0deg) scale(1); } 100% { border-radius: 58% 42% 37% 63% / 55% 61% 39% 45%; transform: rotate(5deg) scale(.97); } }
@keyframes rotateSlow { to { transform: rotate(360deg); } }
@keyframes rotateReverse { to { transform: rotate(-360deg); } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-13px) rotate(4deg); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulse { 50% { transform: scale(1.08); } }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; padding-top: 58px; gap: 35px; }
  .hero-copy { text-align: center; }
  .eyebrow, .hero-metrics { justify-content: center; }
  .hero-description { margin-inline: auto; }
  .hero-art { width: min(76vw, 440px); }
  .control-panel { top: 91px; }
  .card-grid { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .ambient { display: none; }
  .shell { width: min(100% - 24px, 1360px); }
  .site-header { height: 70px; padding-inline: 12px; }
  .brand small { display: none; }
  .brand-mark { width: 38px; height: 38px; }
  .button-label { display: none; }
  .icon-button { width: 40px; min-height: 40px; padding: 0; }
  .voice-popover { position: fixed; top: 76px; right: 12px; }
  .hero { min-height: auto; padding-block: 50px 36px; }
  .hero h1 { font-size: clamp(49px, 15vw, 76px); }
  .hero-metrics { gap: 17px; }
  .hero-metrics div { padding-right: 17px; }
  .hero-art { width: min(88vw, 390px); }
  .orbit { width: 62px; height: 62px; font-size: 15px; }
  .control-panel { position: relative; top: 0; padding: 13px; border-radius: 24px; }
  .level-button { min-height: 63px; padding: 10px; flex-direction: column; justify-content: center; gap: 2px; }
  .level-button span { font-size: 23px; }
  .level-button small { font-size: 9px; }
  .search-row { grid-template-columns: 1fr; }
  .soft-button { min-height: 44px; }
  .filter-row { align-items: stretch; flex-wrap: wrap; }
  .select-field { min-width: 0; width: calc(50% - 6px); flex: 1 1 140px; }
  .select-field select { width: 100%; min-width: 0; }
  .compact-field { margin-left: 0; }

  function populateC1Filters() {
    const topics = [...new Set(DATA.C1.map(item => item.topic).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-CN"));
    const pos = [...new Set(DATA.C1.map(item => item.pos).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-CN"));

  function applyFilters() {
    const query = normalize(state.query);

      if (state.level === "C1" && state.topic !== "all" && item.topic !== state.topic) return false;
      if (state.level === "C1" && state.pos !== "all" && item.pos !== state.pos) return false;

      const haystack = normalize([item.word, item.meaning, item.example, item.translation, item.breakdown, item.topic, item.pos, item.english].filter(Boolean).join(" "));
      return haystack.includes(query);

	  function renderLevelUI() {

  function renderCard(item, index) {

	              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h4l5 4V6L9 10H5Z"/><path d="M17 9c1.5 1.6 1.5 4.4 0 6"/></svg>

  function renderCards() {
    const start = (state.page - 1) * state.perPage;
    const pageItems = state.filtered.slice(start, start + state.perPage);
    if (!pageItems.length) {
      els.grid.innerHTML = `<div class="empty-state"><strong>没有找到匹配词条</strong><p>尝试减少筛选条件，或换一个关键词。</p><button class="soft-button" id="clearFilters" type="button">清除筛选</button></div>`;

  function goToPage(page, scroll = true) {

  function getThaiVoices() {

    return thai.sort((a, b) => {

  }

	  function loadVoices() {

	  function markSpeaking(sourceButton) {

	  async function speakWithBuiltin(clean, sourceButton, requestId, audioContext) {
	    if (!audioContext) {

	      return;
	    }
	    markSpeaking(sourceButton);
	    if (!state.fallbackLoaded) {
	      els.voiceStatus.textContent = "首次加载内置泰语语音…";

	    }
	    try {
	      state.fallbackModule ||= import("https://cdn.jsdelivr.net/npm/espeak-ng@1.0.2/dist/espeak-ng.js");
	      const { default: ESpeakNg } = await state.fallbackModule;
	      if (requestId !== state.speechRequestId) return;
	      const speed = Math.round(170 * Number(els.rate.value));
	      const outputName = `thai-${Date.now()}.wav`;
	      const engine = await ESpeakNg({
	        arguments: ["-v", "th", "-s", String(speed), "-p", "50", "-w", outputName, clean]

	      if (requestId !== state.speechRequestId) return;
	      const wav = engine.FS.readFile(outputName);
	      const wavBuffer = wav.buffer.slice(wav.byteOffset, wav.byteOffset + wav.byteLength);
	      const decoded = await audioContext.decodeAudioData(wavBuffer);
	      if (requestId !== state.speechRequestId) return;
	      const source = audioContext.createBufferSource();
	      source.buffer = decoded;
	      source.connect(audioContext.destination);
	      source.onended = () => {
	        if (state.fallbackSource === source) state.fallbackSource = null;
	        if (requestId === state.speechRequestId) stopSpeakingIndicator();
	      };
	      state.fallbackSource = source;
	      state.fallbackLoaded = true;
	      updateVoiceStatus();
	      source.start();
	    } catch (error) {
	      console.error("Built-in Thai speech failed:", error);
	      if (requestId !== state.speechRequestId) return;
	      stopSpeakingIndicator();
	      els.voiceStatus.textContent = "内置语音加载失败 · 点击可重试";
	      showToast("语音加载失败，请检查网络后重试");
	    }
	  }

	    utterance.pitch = 1;

	    utterance.onstart = () => {
	      if (requestId === state.speechRequestId) markSpeaking(sourceButton);
	    };
	    utterance.onend = () => {
	      if (requestId === state.speechRequestId) stopSpeakingIndicator();
	    };

	      if (requestId !== state.speechRequestId || event.error === "interrupted" || event.error === "canceled") return;

	      speakWithBuiltin(clean, sourceButton, requestId, audioContext);
	    };
	    speechSynthesis.speak(utterance);
	  }

	  function speak(text, sourceButton = null) {

	    const voice = selectedVoice();

	    if (canUseSystem) {

	    }

    els.toolbarHide?.addEventListener("click", () => setToolbarHidden(true));
    els.toolbarRestore?.addEventListener("click", () => setToolbarHidden(false));

      if (!typing && event.key === "ArrowLeft") goToPage(state.page - 1);
      if (!typing && event.key === "ArrowRight") goToPage(state.page + 1);
	      if (event.key === "Escape") stopSpeech();
	    });

	    if ("speechSynthesis" in window) {
	      if (speechSynthesis.addEventListener) speechSynthesis.addEventListener("voiceschanged", loadVoices);
	      else speechSynthesis.onvoiceschanged = loadVoices;
	    }
  }

  function init() {
    if (!DATA[state.level]) state.level = "B1";
    populateC1Filters();
    els.perPage.value = String([6, 12, 24, 48].includes(state.perPage) ? state.perPage : 12);
    state.perPage = Number(els.perPage.value);
    els.rate.value = storage.get("thai-rate", "0.90");
	    els.rateOutput.textContent = `${Number(els.rate.value).toFixed(2)}×`;
    setTheme(state.theme);
    setPractice(state.practice);
    setToolbarHidden(state.toolbarHidden);
    wireEvents();
    loadVoices();
    setTimeout(loadVoices, 250);
    refresh();
  }

  init();
})();

</script>
</body>
</html>
